<!-- Include Supabase JS Client in <head> or right before </body> -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // REPLACE THESE WITH YOUR SUPABASE PROJECT CREDENTIALS:
    const SUPABASE_URL = 'https://mbweotdviwxmutxdjlpj.supabase.co';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;

    // 1. Auth Guard & User Profile
    async function initAuth() {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) {
        window.location.href = 'login.html';
        return;
      }
      currentUser = session.user;

      const userName = currentUser.user_metadata?.full_name || currentUser.email.split('@')[0];
      const headerTitle = document.querySelector('header h1');
      if (headerTitle) headerTitle.textContent = `Good morning, ${userName}`;

      const nameDisplay = document.querySelector('header p.font-semibold');
      if (nameDisplay) nameDisplay.textContent = userName;

      // Load user assets from DB
      loadPortfolioHoldings();
    }
    initAuth();

    // 2. Sign Out Handler
    const signOutBtn = document.querySelector('a[href="index.html"]');
    if (signOutBtn && signOutBtn.textContent.includes('Sign Out')) {
      signOutBtn.addEventListener('click', async (e) => {
        e.preventDefault();
        await supabase.auth.signOut();
        window.location.href = 'login.html';
      });
    }

    // 3. Save Stock Holding to Database
    const stockForm = document.getElementById('form-stocks');
    if (stockForm) {
      const saveBtn = stockForm.querySelector('button.bg-brand-700');
      saveBtn.addEventListener('click', async (e) => {
        e.preventDefault();
        const ticker = stockForm.querySelector('input[type="text"]').value.trim().toUpperCase();
        const market = stockForm.querySelector('select').value;
        const qty = parseFloat(stockForm.querySelector('input[placeholder="100"]').value);
        const price = parseFloat(stockForm.querySelector('input[placeholder="10.45"]').value);

        if (!ticker || isNaN(qty) || isNaN(price)) {
          alert('Please enter valid ticker, quantity, and price.');
          return;
        }

        const { error } = await supabase.from('holdings').insert([{
          user_id: currentUser.id,
          symbol: ticker,
          market: market,
          asset_type: 'stocks',
          shares: qty,
          avg_buy_price: price,
          currency: 'AED'
        }]);

        if (error) {
          alert('Error saving asset: ' + error.message);
        } else {
          alert('Asset saved successfully!');
          showView('portfolio');
          loadPortfolioHoldings();
        }
      });
    }

    // 4. Fetch & Render User Holdings
    async function loadPortfolioHoldings() {
      const { data: holdings, error } = await supabase.from('holdings').select('*');
      if (error || !holdings) return;

      const tbody = document.querySelector('#view-portfolio tbody');
      if (!tbody) return;

      tbody.innerHTML = '';
      let totalStockValue = 0;

      holdings.forEach(item => {
        const val = item.shares * item.avg_buy_price;
        totalStockValue += val;
        tbody.innerHTML += `
          <tr class="hover:bg-zinc-50/50">
            <td class="px-5 py-4">
              <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-brand-100 flex items-center justify-center text-[10px] font-bold text-brand-700">${item.symbol.slice(0, 4)}</div>
                <div>
                  <p class="font-medium text-zinc-900">${item.symbol}</p>
                  <p class="text-[11px] text-zinc-400">${item.asset_type.toUpperCase()}</p>
                </div>
              </div>
            </td>
            <td class="px-5 py-4 text-zinc-500">${item.market}</td>
            <td class="px-5 py-4 text-right tabular-nums">${item.shares.toLocaleString()}</td>
            <td class="px-5 py-4 text-right tabular-nums">${item.avg_buy_price.toFixed(2)}</td>
            <td class="px-5 py-4 text-right tabular-nums font-medium">${item.avg_buy_price.toFixed(2)}</td>
            <td class="px-5 py-4 text-right tabular-nums font-medium">${val.toLocaleString(undefined, { minimumFractionDigits: 2 })}</td>
            <td class="px-5 py-4 text-right tabular-nums text-emerald-600 font-medium">+0.0%</td>
          </tr>
        `;
      });

      // Update Net Worth Card on Overview if assets exist
      const netWorthDisplay = document.querySelector('#view-overview .font-display.text-\\[26px\\]');
      if (netWorthDisplay && totalStockValue > 0) {
        netWorthDisplay.textContent = `AED ${totalStockValue.toLocaleString(undefined, { minimumFractionDigits: 2 })}`;
      }
    }

    // View switcher helper
    const links = document.querySelectorAll('[data-view]');
    const views = document.querySelectorAll('.view');

    function showView(name) {
      views.forEach(v => v.classList.remove('active'));
      document.querySelectorAll('.sidebar-link').forEach(l => {
        l.classList.remove('active');
        l.classList.add('text-zinc-500');
      });
      const target = document.getElementById('view-' + name);
      if (target) target.classList.add('active');
      document.querySelectorAll(`[data-view="${name}"]`).forEach(btn => {
        if (btn.classList.contains('sidebar-link')) {
          btn.classList.add('active');
          btn.classList.remove('text-zinc-500');
        }
      });
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    links.forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        const name = btn.getAttribute('data-view');
        if (name) showView(name);
      });
    });

    function showReForm(type) {
      document.getElementById('form-offplan').classList.add('hidden');
      document.getElementById('form-ready').classList.add('hidden');
      if (type === 'offplan') document.getElementById('form-offplan').classList.remove('hidden');
      if (type === 'ready') document.getElementById('form-ready').classList.remove('hidden');
    }
  </script>
