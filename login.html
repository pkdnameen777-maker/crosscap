<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — CrossCap</title>
  <meta name="theme-color" content="#7e22ce" />
  <link rel="icon" href="assets/favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="icon" href="assets/icon.png" type="image/png" sizes="512x512" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" sizes="180x180" />
  <link rel="manifest" href="manifest.webmanifest" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50:  '#faf5ff',
              100: '#f3e8ff',
              200: '#e9d5ff',
              300: '#d8b4fe',
              400: '#c084fc',
              500: '#a855f7',
              600: '#9333ea',
              700: '#7e22ce',
              800: '#6b21a8',
              900: '#581c87',
              950: '#3b0764',
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Text"', 'Roboto', 'sans-serif'],
            display: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', 'Roboto', 'sans-serif']
          }
        }
      }
    }
  </script>
</head>
<body class="bg-white text-zinc-900 min-h-screen flex flex-col">

  <header class="px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between border-b border-zinc-100/80">
    <a href="/" class="flex items-center gap-2.5">
      <img src="assets/logo.png" alt="CrossCap" class="w-8 h-8 rounded-lg object-contain shrink-0" width="32" height="32" />
      <span class="font-display font-semibold text-[17px] tracking-tight">CrossCap</span>
    </a>
    <a href="/" class="text-[13px] text-zinc-500 hover:text-zinc-800 transition-colors">← Back to home</a>
  </header>

  <main class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-[400px]">
      <div class="bg-white rounded-[22px] border border-zinc-200/80 shadow-lg p-8 sm:p-9">
        <div class="text-center mb-8">
          <img src="assets/logo.png" alt="CrossCap" class="w-14 h-14 rounded-2xl mx-auto mb-5 object-contain shadow" width="56" height="56" />
          <h1 class="font-display text-[22px] font-semibold text-zinc-900 tracking-tight mb-1.5">Welcome to CrossCap</h1>
          <p class="text-[14px] text-zinc-500">Sign in to access your AED wealth dashboard</p>
        </div>

        <div id="auth-error" class="hidden mb-4 p-3 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-xs leading-relaxed"></div>

        <!-- Google OAuth Button -->
        <button id="googleBtn" type="button" class="flex items-center justify-center gap-3 w-full rounded-xl border border-zinc-200 bg-white hover:bg-zinc-50 text-zinc-800 text-[14.5px] font-semibold px-4 py-3.5 shadow-sm transition mb-4">
          <svg class="w-5 h-5" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          Continue with Google
        </button>

        <div class="relative my-6">
          <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-zinc-100"></div></div>
          <div class="relative flex justify-center text-[12px]"><span class="px-3 bg-white text-zinc-400">or continue with email</span></div>
        </div>

        <form id="emailForm" class="space-y-3.5">
          <div>
            <label class="block text-[12px] font-medium text-zinc-600 mb-1.5">Email</label>
            <input id="email" type="email" required placeholder="alex@example.com" class="w-full rounded-xl border border-zinc-200 px-3.5 py-3 text-[14px] focus:outline-none focus:ring-2 focus:ring-brand-500/30" />
          </div>
          <div>
            <label class="block text-[12px] font-medium text-zinc-600 mb-1.5">Password</label>
            <input id="password" type="password" required placeholder="••••••••" class="w-full rounded-xl border border-zinc-200 px-3.5 py-3 text-[14px] focus:outline-none focus:ring-2 focus:ring-brand-500/30" />
          </div>
          <button type="submit" class="w-full rounded-xl bg-brand-700 hover:bg-brand-800 text-white text-[14.5px] font-semibold px-4 py-3.5 shadow transition">
            Sign In / Sign Up
          </button>
        </form>
      </div>
    </div>
  </main>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const SUPABASE_URL = 'https://mbweotdviwxmutxdjlpj.supabase.co';
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1id2VvdGR2aXd4bXV0eGRqbHBqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4MTAxNDQsImV4cCI6MjEwMjM4NjE0NH0.2hbHdyxS7zqiP-CexUsu8hI0nsgkdjCBeIKcQrmJCAw';

      const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      // Auto-redirect if session is active
      supabaseClient.auth.onAuthStateChange((event, session) => {
        if (session) {
          window.location.href = '/dashboard';
        }
      });

      const errorBox = document.getElementById('auth-error');
      function showError(msg) {
        if (errorBox) {
          errorBox.textContent = msg;
          errorBox.classList.remove('hidden');
        } else {
          alert(msg);
        }
      }

      // Google Sign In
      const googleBtn = document.getElementById('googleBtn');
      if (googleBtn) {
        googleBtn.addEventListener('click', async () => {
          const { error } = await supabaseClient.auth.signInWithOAuth({
            provider: 'google',
            options: {
              redirectTo: window.location.origin + '/dashboard'
            }
          });
          if (error) showError(error.message);
        });
      }

      // Email Sign In / Sign Up
      const emailForm = document.getElementById('emailForm');
      if (emailForm) {
        emailForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          const email = document.getElementById('email').value;
          const password = document.getElementById('password').value;

          let { error } = await supabaseClient.auth.signInWithPassword({ email, password });
          if (error && (error.message.includes('Invalid login credentials') || error.message.includes('User not found'))) {
            const signUpRes = await supabaseClient.auth.signUp({ email, password });
            if (signUpRes.error) {
              showError(signUpRes.error.message);
              return;
            }
            window.location.href = '/dashboard';
            return;
          }

          if (error) {
            showError(error.message);
          } else {
            window.location.href = '/dashboard';
          }
        });
      }
    });
  </script>
  <script>
    // PWA service worker
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("/sw.js").catch(function (err) {
          console.warn("SW registration failed", err);
        });
      });
    }
  </script>
</body>
</html>
