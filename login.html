<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — CrossCap GCC Wealth OS</title>
  <meta name="description" content="Sign in to CrossCap, the GCC Wealth OS for expats and investors." />
  <meta name="robots" content="noindex, follow" />
  <link rel="canonical" href="https://crosscap.app/login" />
  <meta name="theme-color" content="#7e22ce" />
  <link rel="icon" href="assets/favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="icon" href="assets/icon.png" type="image/png" sizes="512x512" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" sizes="180x180" />
  <link rel="manifest" href="manifest.webmanifest" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50:  '#faf5ff',
              100: '#f3e8ff',
              200: '#e9d5ff',
              300: '#d8b4fe',
              400: '#c084fc',
              500: '#a855f7',
              600: '#9333ea',
              700: '#7e22ce',
              800: '#6b21a8',
              900: '#581c87',
              950: '#3b0764',
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Text"', 'Roboto', 'sans-serif'],
            display: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', 'Roboto', 'sans-serif']
          }
        }
      }
    }
  </script>
</head>
<body class="bg-white text-zinc-900 min-h-screen flex flex-col">

  <header class="px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between border-b border-zinc-100/80">
    <a href="/" class="flex items-center gap-2.5">
      <img src="assets/logo.png" alt="CrossCap" class="w-8 h-8 rounded-lg object-contain shrink-0" width="32" height="32" />
      <span class="font-display font-semibold text-[17px] tracking-tight">CrossCap</span>
    </a>
    <a href="/" class="text-[13px] text-zinc-500 hover:text-zinc-800 transition-colors">← Back to home</a>
  </header>

  <main class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-[400px]">
      <div class="bg-white rounded-[22px] border border-zinc-200/80 shadow-lg p-8 sm:p-9">
        <div class="text-center mb-8">
          <img src="assets/logo.png" alt="CrossCap" class="w-14 h-14 rounded-2xl object-contain mx-auto mb-4 shadow-sm" width="56" height="56" />
          <h1 id="authTitle" class="font-display text-[22px] font-semibold tracking-tight text-zinc-900">Log in</h1>
          <p id="authSubtitle" class="text-[14px] text-zinc-500 mt-1.5 leading-relaxed">Sign in to access your multi-currency wealth dashboard</p>
        </div>

        <div id="auth-error" class="hidden mb-4 p-3 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-[13px] leading-relaxed"></div>
        <div id="auth-info" class="hidden mb-4 p-3 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-800 text-[13px] leading-relaxed"></div>

        <button id="googleBtn" type="button" class="flex items-center justify-center gap-3 w-full rounded-xl border border-zinc-200 bg-white hover:bg-zinc-50 text-zinc-800 text-[14.5px] font-semibold px-4 py-3.5 shadow-sm transition mb-4">
          <svg class="w-5 h-5" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          <span id="googleBtnLabel">Sign in with Google</span>
        </button>

        <div class="relative my-6">
          <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-zinc-100"></div></div>
          <div class="relative flex justify-center text-[12px]"><span class="px-3 bg-white text-zinc-400">or continue with email</span></div>
        </div>

        <form id="emailForm" class="space-y-3.5">
          <div>
            <label class="block text-[12px] font-medium text-zinc-600 mb-1.5">Email</label>
            <input id="email" type="email" required autocomplete="email" placeholder="you@example.com" class="w-full rounded-xl border border-zinc-200 px-3.5 py-3 text-[14px] focus:outline-none focus:ring-2 focus:ring-brand-500/30" />
          </div>
          <div>
            <div class="flex items-center justify-between mb-1.5">
              <label class="block text-[12px] font-medium text-zinc-600">Password</label>
              <button type="button" id="forgotBtn" class="text-[12px] font-medium text-brand-700 hover:underline">Forgot password?</button>
            </div>
            <input id="password" type="password" required autocomplete="current-password" minlength="6" placeholder="••••••••" class="w-full rounded-xl border border-zinc-200 px-3.5 py-3 text-[14px] focus:outline-none focus:ring-2 focus:ring-brand-500/30" />
            <p id="passwordHint" class="hidden mt-1.5 text-[11px] text-zinc-400">At least 6 characters</p>
          </div>
          <button id="submitBtn" type="submit" class="w-full rounded-xl bg-brand-700 hover:bg-brand-800 text-white text-[14.5px] font-semibold px-4 py-3.5 shadow transition">
            Log in
          </button>
        </form>

        <p id="switchMode" class="mt-6 text-center text-[13px] text-zinc-500">
          New to CrossCap?
          <button type="button" id="switchBtn" class="font-semibold text-brand-700 hover:underline">Sign up</button>
        </p>
      </div>
    </div>
  </main>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const SUPABASE_URL = 'https://mbweotdviwxmutxdjlpj.supabase.co';
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1id2VvdGR2aXd4bXV0eGRqbHBqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4MTAxNDQsImV4cCI6MjEwMjM4NjE0NH0.2hbHdyxS7zqiP-CexUsu8hI0nsgkdjCBeIKcQrmJCAw';

      const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      supabaseClient.auth.onAuthStateChange((event, session) => {
        if (session) window.location.href = '/dashboard';
      });

      let mode = 'login'; // 'login' | 'signup'

      const errorBox = document.getElementById('auth-error');
      const infoBox = document.getElementById('auth-info');
      const titleEl = document.getElementById('authTitle');
      const subtitleEl = document.getElementById('authSubtitle');
      const submitBtn = document.getElementById('submitBtn');
      const switchBtn = document.getElementById('switchBtn');
      const switchMode = document.getElementById('switchMode');
      const googleLabel = document.getElementById('googleBtnLabel');
      const passwordHint = document.getElementById('passwordHint');
      const passwordInput = document.getElementById('password');
      const forgotBtn = document.getElementById('forgotBtn');

      function clearMessages() {
        if (errorBox) { errorBox.textContent = ''; errorBox.classList.add('hidden'); }
        if (infoBox) { infoBox.textContent = ''; infoBox.classList.add('hidden'); }
      }
      function showError(msg) {
        clearMessages();
        if (errorBox) {
          errorBox.textContent = msg;
          errorBox.classList.remove('hidden');
        } else alert(msg);
      }
      function showInfo(msg) {
        clearMessages();
        if (infoBox) {
          infoBox.textContent = msg;
          infoBox.classList.remove('hidden');
        }
      }

      function setMode(next) {
        mode = next;
        clearMessages();
        if (mode === 'login') {
          titleEl.textContent = 'Log in';
          subtitleEl.textContent = 'Sign in to access your multi-currency wealth dashboard';
          submitBtn.textContent = 'Log in';
          googleLabel.textContent = 'Sign in with Google';
          switchMode.innerHTML = 'New to CrossCap? <button type="button" id="switchBtn" class="font-semibold text-brand-700 hover:underline">Sign up</button>';
          passwordInput.autocomplete = 'current-password';
          passwordHint.classList.add('hidden');
          forgotBtn.classList.remove('hidden');
        } else {
          titleEl.textContent = 'Sign up';
          subtitleEl.textContent = 'Create your CrossCap account to track net worth across currencies';
          submitBtn.textContent = 'Create account';
          googleLabel.textContent = 'Sign up with Google';
          switchMode.innerHTML = 'Already have an account? <button type="button" id="switchBtn" class="font-semibold text-brand-700 hover:underline">Log in</button>';
          passwordInput.autocomplete = 'new-password';
          passwordHint.classList.remove('hidden');
          forgotBtn.classList.add('hidden');
        }
        document.getElementById('switchBtn')?.addEventListener('click', () => setMode(mode === 'login' ? 'signup' : 'login'));
      }

      document.getElementById('switchBtn')?.addEventListener('click', () => setMode('signup'));

      // Support ?mode=signup
      try {
        if (new URLSearchParams(location.search).get('mode') === 'signup') setMode('signup');
      } catch (_) {}

      document.getElementById('googleBtn')?.addEventListener('click', async () => {
        clearMessages();
        const { error } = await supabaseClient.auth.signInWithOAuth({
          provider: 'google',
          options: { redirectTo: window.location.origin + '/dashboard' }
        });
        if (error) showError(error.message);
      });

      document.getElementById('forgotBtn')?.addEventListener('click', async () => {
        clearMessages();
        const email = (document.getElementById('email').value || '').trim();
        if (!email) {
          showError('Enter your email above, then click Forgot password.');
          return;
        }
        const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
          redirectTo: window.location.origin + '/login'
        });
        if (error) showError(error.message);
        else showInfo('If an account exists for that email, we sent a reset link. Check your inbox (and spam).');
      });

      document.getElementById('emailForm')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearMessages();
        const email = (document.getElementById('email').value || '').trim();
        const password = document.getElementById('password').value || '';

        if (password.length < 6) {
          showError('Password must be at least 6 characters.');
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = mode === 'login' ? 'Signing in…' : 'Creating account…';

        try {
          if (mode === 'login') {
            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) {
              const msg = (error.message || '').toLowerCase();
              if (msg.includes('invalid') || msg.includes('credentials')) {
                showError("Incorrect email or password. If you're new, use Sign up. If you signed up with Google, use Continue with Google.");
              } else if (msg.includes('confirm') || msg.includes('not confirmed')) {
                showError('Please confirm your email first. Check your inbox for the confirmation link.');
              } else {
                showError(error.message);
              }
              return;
            }
            window.location.href = '/dashboard';
            return;
          }

          // Sign up
          const { data, error } = await supabaseClient.auth.signUp({
            email,
            password,
            options: { emailRedirectTo: window.location.origin + '/dashboard' }
          });
          if (error) {
            const msg = (error.message || '').toLowerCase();
            if (msg.includes('already') || msg.includes('registered')) {
              showError('An account with this email already exists. Log in instead, or use Forgot password.');
              setMode('login');
            } else {
              showError(error.message);
            }
            return;
          }
          // If session returned, email confirm is off
          if (data?.session) {
            window.location.href = '/dashboard';
            return;
          }
          showInfo('Account created. Check your email to confirm, then log in. (If no email arrives, ask your admin to disable "Confirm email" in Supabase.)');
          setMode('login');
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = mode === 'login' ? 'Log in' : 'Create account';
        }
      });
    });
  </script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("/sw.js").catch(function (err) {
          console.warn("SW registration failed", err);
        });
      });
    }
  </script>
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
