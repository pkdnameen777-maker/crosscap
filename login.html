<script>
    // Configuration
    const SUPABASE_URL = 'https://mbweotdviwxmutxdjlpj.supabase.co';
    const SUPABASE_ANON_KEY = 'PASTE_YOUR_ACTUAL_ANON_KEY_HERE';

    // Rename variable to `supabaseClient` to prevent naming collision with the library
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Auto-redirect if already logged in
    supabaseClient.auth.getSession().then(({ data: { session } }) => {
      if (session) {
        window.location.href = 'dashboard.html';
      }
    });

    const errorBox = document.getElementById('auth-error');
    function showError(msg) {
      if (errorBox) {
        errorBox.textContent = msg;
        errorBox.classList.remove('hidden');
      } else {
        alert(msg);
      }
    }

    // 1. Google OAuth
    const googleBtn = document.getElementById('googleBtn');
    if (googleBtn) {
      googleBtn.addEventListener('click', async () => {
        const { error } = await supabaseClient.auth.signInWithOAuth({
          provider: 'google',
          options: {
            redirectTo: window.location.origin + '/dashboard.html'
          }
        });
        if (error) showError(error.message);
      });
    }

    // 2. Email Sign In / Sign Up
    const emailForm = document.getElementById('emailForm');
    if (emailForm) {
      emailForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        let { error } = await supabaseClient.auth.signInWithPassword({ email, password });
        
        if (error && (error.message.includes('Invalid login credentials') || error.message.includes('User not found'))) {
          const signUpRes = await supabaseClient.auth.signUp({ email, password });
          if (signUpRes.error) {
            showError(signUpRes.error.message);
            return;
          }
          window.location.href = 'dashboard.html';
          return;
        }

        if (error) {
          showError(error.message);
        } else {
          window.location.href = 'dashboard.html';
        }
      });
    }
  </script>
