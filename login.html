<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — CrossCap</title>
  <meta name="theme-color" content="#7e22ce" />
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/icon.svg" />
  <link rel="manifest" href="manifest.webmanifest" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50:  '#faf5ff',
              100: '#f3e8ff',
              200: '#e9d5ff',
              300: '#d8b4fe',
              400: '#c084fc',
              500: '#a855f7',
              600: '#9333ea',
              700: '#7e22ce',
              800: '#6b21a8',
              900: '#581c87',
              950: '#3b0764',
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Text"', '"SF Pro Display"', '"Segoe UI"', 'Roboto', '"Helvetica Neue"', 'Arial', 'sans-serif'],
            display: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', '"Segoe UI"', 'Roboto', '"Helvetica Neue"', 'Arial', 'sans-serif']
          },
          boxShadow: {
            'soft': '0 4px 24px -4px rgba(88, 28, 135, 0.07), 0 2px 8px -2px rgba(0,0,0,0.04)',
            'card': '0 10px 40px -10px rgba(88, 28, 135, 0.12), 0 4px 14px -4px rgba(0,0,0,0.05)',
            'glow': '0 0 48px -10px rgba(168, 85, 247, 0.35)',
          }
        }
      }
    }
  </script>
  <style>
    html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      letter-spacing: -0.01em;
    }
    .font-display, h1, h2 {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      letter-spacing: -0.025em;
    }
    .hero-bg {
      background:
        radial-gradient(ellipse 70% 50% at 50% 0%, rgba(168, 85, 247, 0.12), transparent),
        radial-gradient(ellipse 40% 30% at 90% 20%, rgba(192, 132, 252, 0.08), transparent);
    }
  </style>
</head>
<body class="bg-white text-zinc-900 min-h-screen flex flex-col">

  <!-- Minimal top bar -->
  <header class="px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between border-b border-zinc-100/80">
    <a href="index.html" class="flex items-center gap-2.5">
      <img src="assets/logo.svg" alt="CrossCap" class="w-8 h-8 rounded-lg" />
      <span class="font-display font-semibold text-[17px] tracking-tight">CrossCap</span>
    </a>
    <a href="index.html" class="text-[13px] text-zinc-500 hover:text-zinc-800 transition-colors">← Back to home</a>
  </header>

  <main class="flex-1 flex items-center justify-center px-4 py-12 hero-bg">
    <div class="w-full max-w-[400px]">
      <!-- Card -->
      <div class="bg-white rounded-[22px] border border-zinc-200/80 shadow-card p-8 sm:p-9">
        <div class="text-center mb-8">
          <img src="assets/logo.svg" alt="CrossCap" class="w-14 h-14 rounded-2xl mx-auto mb-5 shadow-soft" />
          <h1 class="font-display text-[22px] font-semibold text-zinc-900 tracking-tight mb-1.5">Welcome to CrossCap</h1>
          <p class="text-[14px] text-zinc-500">Sign in to access your AED wealth dashboard</p>
        </div>

        <!-- Google Connect -->
        <a href="dashboard.html" class="group flex items-center justify-center gap-3 w-full rounded-xl border border-zinc-200 bg-white hover:bg-zinc-50 hover:border-zinc-300 text-zinc-800 text-[14.5px] font-semibold px-4 py-3.5 shadow-soft transition-all mb-4">
          <svg class="w-5 h-5" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          Continue with Google
        </a>

        <div class="relative my-6">
          <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-zinc-100"></div></div>
          <div class="relative flex justify-center text-[12px]"><span class="px-3 bg-white text-zinc-400">or continue with email</span></div>
        </div>

        <!-- Email form (demo) -->
        <form action="dashboard.html" method="get" class="space-y-3.5">
          <div>
            <label class="block text-[12px] font-medium text-zinc-600 mb-1.5">Email</label>
            <input type="email" required placeholder="alex@example.com" class="w-full rounded-xl border border-zinc-200 bg-white px-3.5 py-3 text-[14px] text-zinc-900 placeholder:text-zinc-400 focus:outline-none focus:ring-2 focus:ring-brand-500/30 focus:border-brand-400 transition" />
          </div>
          <div>
            <label class="block text-[12px] font-medium text-zinc-600 mb-1.5">Password</label>
            <input type="password" required placeholder="••••••••" class="w-full rounded-xl border border-zinc-200 bg-white px-3.5 py-3 text-[14px] text-zinc-900 placeholder:text-zinc-400 focus:outline-none focus:ring-2 focus:ring-brand-500/30 focus:border-brand-400 transition" />
          </div>
          <button type="submit" class="w-full rounded-xl bg-brand-700 hover:bg-brand-800 text-white text-[14.5px] font-semibold px-4 py-3.5 shadow-soft hover:shadow-glow transition-all mt-1">
            Sign in to Dashboard
          </button>
        </form>

        <p class="text-center text-[12.5px] text-zinc-400 mt-6">
          Don’t have an account?
          <a href="dashboard.html" class="text-brand-700 font-medium hover:underline">Create free account</a>
        </p>
      </div>

      <p class="text-center text-[11.5px] text-zinc-400 mt-6 leading-relaxed">
        By continuing you agree to CrossCap’s<br>
        <a href="#" class="underline hover:text-zinc-600">Terms of Service</a> and <a href="#" class="underline hover:text-zinc-600">Privacy Policy</a>
      </p>
    </div>
  </main>
</body>
</html>
